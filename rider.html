<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1b1715"><title>Bon Amigos Rider</title><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script><style>body{margin:0;font-family:system-ui;background:radial-gradient(circle at top right,#d9f3e7 0,#f6f2ec 42%,#eee6dc 100%);color:#211b18;min-height:100vh}.wrap{max-width:1000px;margin:auto;padding:18px}.top,.card{background:#fff;border:1px solid #e4d8ce;border-radius:18px;padding:18px;box-shadow:0 12px 35px #3a24180d}.top{background:linear-gradient(135deg,#1d5d43,#27805a);color:#fff}.top .muted{color:#d8f4e7}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat b{font-size:28px;display:block}.list{display:grid;gap:10px;margin-top:14px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:14px;border:1px solid #e3dbd3;border-radius:12px;background:#fff}.muted{color:#746b64;font-size:13px}.btn{border:0;border-radius:9px;padding:10px 14px;cursor:pointer;font-weight:700}.primary{background:#201a17;color:#fff}.light{background:#eee8e2}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login .card{max-width:420px;width:100%}.form{display:grid;gap:10px}.form input{padding:12px;border:1px solid #d8cec5;border-radius:8px}.hidden{display:none}@media(max-width:650px){.grid{grid-template-columns:repeat(2,1fr)}.row{align-items:flex-start;flex-direction:column}.row .actions{width:100%;display:flex;gap:8px;flex-wrap:wrap}}</style></head><body><div id="login" class="login"><div class="card"><h1>Bon Amigos Rider</h1><p class="muted">Realtime delivery dashboard</p><form id="loginForm" class="form"><input id="email" type="email" placeholder="Rider email" required><input id="password" type="password" placeholder="Password" required><button class="btn primary">Login</button></form><p id="err" class="muted"></p></div></div><div id="app" class="wrap hidden"><div class="top"><div><b>🚴 Rider Dashboard</b><div id="who" class="muted"></div></div><div style="display:flex;gap:8px;align-items:center"><button id="duty" class="btn primary">Duty OFF</button><button id="logout" class="btn light">Logout</button></div></div><div class="grid"><div class="card stat"><span>Assigned</span><b id="assigned">0</b></div><div class="card stat"><span>Out for delivery</span><b id="out">0</b></div><div class="card stat"><span>Delivered Today</span><b id="delivered">0</b></div><div class="card stat"><span>Live GPS</span><b id="gps">OFF</b></div></div><section class="card" style="margin-top:14px"><h2>My Orders</h2><div id="orders" class="list"></div></section></div><script>const firebaseConfig={apiKey:"AIzaSyCmrAbpKaR0cSkigBs8rbW9g8l2db47n9A",databaseURL:"https://restro-56bc7-default-rtdb.firebaseio.com",authDomain:"restro-56bc7.firebaseapp.com",projectId:"restro-56bc7",storageBucket:"restro-56bc7.firebasestorage.app",messagingSenderId:"636167397540",appId:"1:636167397540:web:cfc9d31275fc8832b9c631",measurementId:"G-X3QF67PKXS"};const portalApp=firebase.initializeApp(firebaseConfig,'bonAmigosRiderPortal');const db=portalApp.database(),auth=portalApp.auth(),$=id=>document.getElementById(id);auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(()=>{});let uid=null, staffData=null, dutyOn=false, locationWatchId=null;let knownAssigned=new Set(), audioCtx=null;
function armSound(){try{if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();}catch(e){}}
function beep(){try{armSound();if(!audioCtx)return;let t=audioCtx.currentTime;for(let i=0;i<3;i++){let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=i===1?990:740;g.gain.setValueAtTime(.0001,t+i*.2);g.gain.exponentialRampToValueAtTime(.22,t+i*.2+.02);g.gain.exponentialRampToValueAtTime(.0001,t+i*.2+.15);o.connect(g);g.connect(audioCtx.destination);o.start(t+i*.2);o.stop(t+i*.2+.16);}}catch(e){}}
function notify(title,body){try{if('Notification' in window&&Notification.permission==='granted')new Notification(title,{body});}catch(e){}}
async function requestNotify(){try{if('Notification' in window&&Notification.permission==='default')await Notification.requestPermission();}catch(e){}armSound();}
document.addEventListener('click',requestNotify,{once:true});
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));function render(v){const arr=Object.entries(v||{}).map(([id,x])=>({id,...x})).filter(x=>x.riderId===uid).sort((a,b)=>Number(b.createdAt||0)-Number(a.createdAt||0));$('assigned').textContent=arr.filter(x=>!['delivered','cancelled'].includes(x.status)).length;$('out').textContent=arr.filter(x=>x.status==='out_for_delivery').length;$('delivered').textContent=arr.filter(x=>x.status==='delivered').length;$('orders').innerHTML=arr.map(o=>{let nav=Number.isFinite(Number(o.latitude))&&Number.isFinite(Number(o.longitude))?`<a class="btn light" target="_blank" href="https://www.google.com/maps/dir/?api=1&destination=${o.latitude},${o.longitude}">Navigate</a>`:'';let next=o.status==='assigned'?'accepted':o.status==='accepted'?'picked_up':o.status==='picked_up'?'out_for_delivery':o.status==='out_for_delivery'?'delivered':'';return `<div class="row"><div><b>#${esc(o.orderNo||o.id.slice(0,7))}</b> · ₹${esc(o.total||0)}<div>${esc(o.name)} · ${esc(o.phone)}</div><div class="muted">${esc(o.address)}${o.gpsAddress?' · '+esc(o.gpsAddress):''}</div><div class="muted">Status: ${esc(o.status)}</div></div><div class="actions">${nav} ${next?`<button class="btn primary" onclick="statusOrder('${o.id}','${next}')">${next.replaceAll('_',' ').toUpperCase()}</button>`:''}</div></div>`}).join('')||'<p class="muted">No orders assigned.</p>'}function listen(){db.ref('orders').orderByChild('riderId').equalTo(uid).on('value',s=>{const v=s.val()||{};const current=new Set(Object.keys(v));for(const [id,o] of Object.entries(v)){if(!knownAssigned.has(id)&&!['delivered','cancelled'].includes(o.status)){beep();notify('🚴 New Order Assigned','#'+(o.orderNo||id.slice(0,7))+' · ₹'+(o.total||0));}}knownAssigned=current;render(v);})}
function setDuty(on){dutyOn=!!on;$('duty').textContent=dutyOn?'Duty ON':'Duty OFF';$('duty').className='btn '+(dutyOn?'primary':'light');if(dutyOn){if(navigator.geolocation&&!locationWatchId){locationWatchId=navigator.geolocation.watchPosition(p=>{db.ref('riderLocations/'+uid).set({latitude:p.coords.latitude,longitude:p.coords.longitude,updatedAt:Date.now(),online:true,dutyOn:true}) .then(()=>$('gps').textContent='ON').catch(()=>{});},()=>{$('gps').textContent='OFF'}, {enableHighAccuracy:true,maximumAge:15000,timeout:10000});}}else{if(locationWatchId!=null&&navigator.geolocation){navigator.geolocation.clearWatch(locationWatchId);locationWatchId=null;}db.ref('riderLocations/'+uid).remove().catch(()=>{});$('gps').textContent='OFF';}db.ref('staff/'+uid).update({dutyOn:dutyOn}).catch(()=>{});}
$('duty').onclick=()=>setDuty(!dutyOn);
window.statusOrder=async(id,status)=>{try{await db.ref('orders/'+id).update({status,updatedAt:Date.now()});}catch(e){alert(e.message||'Could not update order.');}};$('loginForm').onsubmit=async e=>{e.preventDefault();$('err').textContent='';try{await auth.signInWithEmailAndPassword($('email').value.trim(),$('password').value)}catch(x){$('err').textContent=x.message}};$('logout').onclick=()=>auth.signOut();auth.onAuthStateChanged(async u=>{
 if(!u){uid=null;staffData=null;dutyOn=false;if(locationWatchId!=null&&navigator.geolocation){navigator.geolocation.clearWatch(locationWatchId);locationWatchId=null;}$('login').classList.remove('hidden');$('app').classList.add('hidden');return;}
 try{
   const snap=await db.ref('staff/'+u.uid).once('value'),v=snap.val();
   if(!snap.exists()||v.role!=='rider'||v.active===false){$('err').textContent='This account is not an active Rider. Ask Admin to enable the Rider profile.';await auth.signOut();return;}
   uid=u.uid;staffData=v;dutyOn=v.dutyOn===true;$('who').textContent=v.name||u.email;$('login').classList.add('hidden');$('app').classList.remove('hidden');
   listen(); if(dutyOn) setDuty(true);
 }catch(x){console.error(x);$('err').textContent='Could not load rider profile. Check connection/Rules and tap Login again.';}
});</script></body></html>
