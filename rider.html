<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rider Dashboard | Bon Amigos</title>
<meta name="robots" content="noindex, nofollow">

<!-- ============================================================
  BON AMIGOS — RIDER DASHBOARD
  For delivery riders: see confirmed orders ready for pickup,
  claim one, then mark it delivered once dropped off.
  NOT linked from public nav — share this URL with riders directly.

  SETUP: same Firebase project as index.html/admin.html.
  Create one Authentication > Users login per rider (Firebase
  Console > Authentication > Users > Add user). Fill FIREBASE_CONFIG
  below with the SAME values as the other pages.
  ============================================================ -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
  :root{
    --ink:#241A16; --ivory:#FBF7F1; --paper:#F3ECE2;
    --wine:#7A1F2B; --wine-deep:#5A1620; --gold:#B98A3B;
    --olive:#5F6B47; --line:rgba(36,26,22,0.12);
    --font-display:"Fraunces",Georgia,serif; --font-body:"Manrope",-apple-system,sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:var(--font-body);color:var(--ink);background:var(--paper);}
  h1,h2{font-family:var(--font-display);font-weight:600;margin:0;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;}
  input{font-family:inherit;}

  .login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .login-card{background:var(--ivory);border:1px solid var(--line);border-radius:8px;padding:36px 30px;width:100%;max-width:340px;}
  .login-card h1{font-size:1.4rem;margin-bottom:6px;}
  .login-card p{color:#6c5d54;font-size:0.9rem;margin:0 0 22px;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:0.82rem;font-weight:700;margin-bottom:6px;}
  .field input{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:6px;font-size:0.95rem;background:#fff;}
  .field input:focus{outline:none;border-color:var(--wine);}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;font-size:0.92rem;font-weight:600;border-radius:6px;width:100%;background:var(--wine);color:#fff;}
  .btn:hover{background:var(--wine-deep);}
  .btn-sm{width:auto;padding:8px 16px;font-size:0.82rem;border-radius:6px;background:var(--wine);color:#fff;font-weight:700;}
  .btn-outline-sm{width:auto;padding:7px 14px;font-size:0.8rem;border-radius:6px;border:1.5px solid var(--line);color:var(--ink);font-weight:600;}
  .btn-outline-sm:hover{border-color:var(--wine);color:var(--wine);}
  .login-error{color:var(--wine-deep);font-size:0.85rem;margin-top:14px;display:none;}
  .login-error.show{display:block;}

  .dash{display:none;min-height:100vh;padding-bottom:40px;}
  .dash.open{display:block;}
  .topbar{background:var(--ink);color:var(--ivory);padding:16px 20px;display:flex;align-items:center;justify-content:space-between;}
  .topbar .logo{font-family:var(--font-display);font-size:1.1rem;}
  .topbar .logo span{color:var(--gold);font-family:var(--font-body);font-size:0.72rem;display:block;margin-top:2px;}
  #logoutBtn{color:#D8CEC2;font-size:0.85rem;}
  #logoutBtn:hover{color:#fff;}

  .tabbar{max-width:700px;margin:0 auto;padding:16px 16px 0;display:flex;gap:6px;}
  .tabbar button{flex:1;padding:11px;font-size:0.86rem;font-weight:700;border-radius:8px;color:#6c5d54;background:var(--ivory);border:1.5px solid var(--line);}
  .tabbar button.active{color:#fff;background:var(--wine);border-color:var(--wine);}

  .tab-panel{display:none;}
  .tab-panel.active{display:block;}
  .content{max-width:700px;margin:0 auto;padding:16px;}
  .loading, .empty-state{text-align:center;padding:50px 20px;color:#8C8074;}
  .empty-state h2{font-size:1.05rem;color:var(--ink);margin-bottom:6px;}

  .order-card{background:var(--ivory);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:12px;}
  .order-name{font-weight:700;font-size:1rem;}
  .order-sub{font-size:0.82rem;color:#6c5d54;margin-top:2px;}
  .order-items{font-size:0.86rem;color:#4a3f38;background:var(--paper);border-radius:6px;padding:10px 14px;margin:10px 0;}
  .order-address{font-size:0.87rem;color:#4a3f38;margin-bottom:6px;}
  .order-address a{color:var(--wine);font-weight:700;}
  .pill{display:inline-block;padding:4px 11px;border-radius:20px;font-size:0.74rem;font-weight:700;}
  .pill.cod{background:#EDE7DE;color:#5c4f47;}
  .pill.upi{background:#E9E1F2;color:#5B3A85;}
  .order-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
  .call-link{display:inline-flex;align-items:center;gap:6px;font-size:0.82rem;font-weight:700;color:var(--wine);}
</style>
</head>
<body>

<script>
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCmrAbpKaR0cSkigBs8rbW9g8l2db47n9A",
  authDomain: "restro-56bc7.firebaseapp.com",
  databaseURL: "https://restro-56bc7-default-rtdb.firebaseio.com",
  projectId: "restro-56bc7",
  storageBucket: "restro-56bc7.firebasestorage.app",
  messagingSenderId: "636167397540",
  appId: "1:636167397540:web:cfc9d31275fc8832b9c631",
  measurementId: "G-X3QF67PKXS"
};
firebase.initializeApp(FIREBASE_CONFIG);
const auth = firebase.auth();
const db = firebase.firestore();
</script>

<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <h1>Rider Login</h1>
    <p>Sign in to see orders ready for delivery.</p>
    <form id="loginForm">
      <div class="field"><label for="loginEmail">Email</label><input type="email" id="loginEmail" required autocomplete="username"></div>
      <div class="field"><label for="loginPassword">Password</label><input type="password" id="loginPassword" required autocomplete="current-password"></div>
      <button type="submit" class="btn" id="loginBtn">Sign In</button>
      <p class="login-error" id="loginError"></p>
    </form>
  </div>
</div>

<div class="dash" id="dash">
  <div class="topbar">
    <div class="logo">Bon Amigos<span id="riderLabel">Rider</span></div>
    <button id="logoutBtn">Sign Out</button>
  </div>

  <div class="tabbar" id="tabbar">
    <button data-tab="available" class="active">Available</button>
    <button data-tab="mine">My Deliveries</button>
  </div>

  <div class="tab-panel active" id="panel-available">
    <div class="content">
      <div class="loading" id="availLoading">Loading orders…</div>
      <div id="availList"></div>
      <div class="empty-state" id="availEmpty" style="display:none;">
        <h2>No orders waiting</h2>
        <p>Confirmed orders ready for pickup will show up here.</p>
      </div>
    </div>
  </div>

  <div class="tab-panel" id="panel-mine">
    <div class="content">
      <div class="loading" id="mineLoading">Loading your deliveries…</div>
      <div id="mineList"></div>
      <div class="empty-state" id="mineEmpty" style="display:none;">
        <h2>Nothing out with you right now</h2>
        <p>Pick up an order from the Available tab to see it here.</p>
      </div>
    </div>
  </div>
</div>

<script>
let currentUserEmail = null;
let allOrders = [];
let unsubOrders = null;

document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = document.getElementById("loginEmail").value.trim();
  const pass  = document.getElementById("loginPassword").value;
  const btn   = document.getElementById("loginBtn");
  const err   = document.getElementById("loginError");
  err.classList.remove("show");
  btn.disabled = true; btn.textContent = "Signing in…";
  try{
    await auth.signInWithEmailAndPassword(email, pass);
  }catch(e){
    err.textContent = "Incorrect email or password.";
    err.classList.add("show");
    btn.disabled = false; btn.textContent = "Sign In";
  }
});
document.getElementById("logoutBtn").addEventListener("click", () => auth.signOut());

auth.onAuthStateChanged((user) => {
  if(user){
    currentUserEmail = user.email;
    document.getElementById("riderLabel").textContent = user.email;
    document.getElementById("loginScreen").style.display = "none";
    document.getElementById("dash").classList.add("open");
    subscribeToOrders();
  }else{
    document.getElementById("loginScreen").style.display = "flex";
    document.getElementById("dash").classList.remove("open");
    document.getElementById("loginBtn").disabled = false;
    document.getElementById("loginBtn").textContent = "Sign In";
    if(unsubOrders) unsubOrders();
  }
});

document.getElementById("tabbar").addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-tab]");
  if(!btn) return;
  document.querySelectorAll("#tabbar button").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
  document.getElementById("panel-"+btn.dataset.tab).classList.add("active");
});

function subscribeToOrders(){
  document.getElementById("availLoading").style.display = "";
  document.getElementById("mineLoading").style.display = "";
  // Confirmed + out_for_delivery orders make up the rider's working set —
  // filtered client-side into "available" vs "mine" below.
  unsubOrders = db.collection("orders")
    .where("orderStatus", "in", ["confirmed", "out_for_delivery"])
    .onSnapshot((snap) => {
      allOrders = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      render();
    }, (err) => {
      console.error("Failed to load orders:", err);
      document.getElementById("availLoading").textContent = "Couldn't load orders. Check Firestore rules and your connection.";
      document.getElementById("mineLoading").textContent = "Couldn't load orders.";
    });
}

async function pickUp(id){
  try{
    await db.collection("orders").doc(id).update({
      orderStatus: "out_for_delivery",
      riderName: currentUserEmail
    });
  }catch(e){ console.error(e); alert("Couldn't pick up this order."); }
}
async function markDelivered(id){
  try{
    await db.collection("orders").doc(id).update({ orderStatus: "delivered" });
  }catch(e){ console.error(e); alert("Couldn't mark as delivered."); }
}

function escapeHtml(str){
  const div = document.createElement("div");
  div.textContent = str || "";
  return div.innerHTML;
}

function orderCard(o, mode){
  const itemsList = (o.items||[]).map(l => `${l.qty}x ${escapeHtml(l.name)}`).join(", ");
  const mapsHref = o.location ? `https://maps.google.com/?q=${o.location.lat},${o.location.lng}` : null;
  const action = mode === "available"
    ? `<button class="btn-sm" onclick="pickUp('${o.id}')">Pick Up</button>`
    : `<button class="btn-sm" onclick="markDelivered('${o.id}')">Mark Delivered</button>`;

  return `
    <div class="order-card">
      <div class="order-name">${escapeHtml(o.name)}</div>
      <div class="order-sub">₹${o.subtotal} · <span class="pill ${o.paymentMethod}">${o.paymentMethod === "upi" ? "UPI Paid" : "Collect Cash"}</span></div>
      <div class="order-items">${itemsList || "—"}</div>
      <div class="order-address">
        📍 ${escapeHtml(o.address)}
        ${mapsHref ? ` · <a href="${mapsHref}" target="_blank" rel="noopener">Open in Maps</a>` : ""}
      </div>
      <div class="order-actions">
        ${action}
        <a class="call-link" href="tel:${o.phone}">📞 Call Customer</a>
      </div>
    </div>
  `;
}

function render(){
  document.getElementById("availLoading").style.display = "none";
  document.getElementById("mineLoading").style.display = "none";

  const available = allOrders.filter(o => o.orderStatus === "confirmed");
  const mine = allOrders.filter(o => o.orderStatus === "out_for_delivery" && o.riderName === currentUserEmail);

  const availList = document.getElementById("availList");
  const availEmpty = document.getElementById("availEmpty");
  if(!available.length){ availList.innerHTML=""; availEmpty.style.display=""; }
  else{ availEmpty.style.display="none"; availList.innerHTML = available.map(o => orderCard(o,"available")).join(""); }

  const mineList = document.getElementById("mineList");
  const mineEmpty = document.getElementById("mineEmpty");
  if(!mine.length){ mineList.innerHTML=""; mineEmpty.style.display=""; }
  else{ mineEmpty.style.display="none"; mineList.innerHTML = mine.map(o => orderCard(o,"mine")).join(""); }
}
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">

</body>
</html>
