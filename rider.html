<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#6d1f2a"><title>Bon Amigos • Rider Dashboard</title><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script><style>
:root{--wine:#7a1f2b;--deep:#51131b;--gold:#c79a4b;--cream:#fbf7f1;--paper:#f1e8dc;--ink:#241a16;--muted:#776b62;--line:#e4d9cd;--green:#198754}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:linear-gradient(135deg,#fffaf5,#f1e8dc);color:var(--ink)}button,input{font:inherit}.wrap{max-width:1120px;margin:auto;padding:18px}.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at top right,#ead2ad55,transparent 35%),linear-gradient(135deg,#fffaf5,#eee1d1)}.login-card{width:min(430px,100%);background:#fff; padding:30px;border:1px solid var(--line);border-radius:24px;box-shadow:0 24px 70px #3b241d1c}.brand{display:flex;align-items:center;gap:12px;margin-bottom:24px}.logo{width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,var(--wine),var(--deep));color:#fff;display:grid;place-items:center;font-weight:900;font-size:22px}.brand h1{font-family:Georgia,serif;margin:0;font-size:25px}.muted{color:var(--muted);font-size:13px}.form{display:grid;gap:13px}.form input{width:100%;padding:14px 15px;border:1px solid var(--line);border-radius:13px;background:#fff;outline:none}.form input:focus{border-color:var(--wine);box-shadow:0 0 0 3px #7a1f2b18}.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:800;cursor:pointer}.primary{background:linear-gradient(135deg,var(--wine),var(--deep));color:#fff;box-shadow:0 8px 20px #7a1f2b2b}.light{background:#f4eee8;color:var(--ink)}.top{background:linear-gradient(135deg,var(--wine),var(--deep));color:#fff;border-radius:22px;padding:20px 22px;display:flex;justify-content:space-between;align-items:center;gap:14px;box-shadow:0 16px 35px #5a162026}.top small{opacity:.75}.top .light{background:#ffffff18;color:#fff;border:1px solid #ffffff2c}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:16px 0}.stat{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 8px 25px #3b241d0a}.stat span{color:var(--muted);font-size:13px}.stat b{display:block;font-size:30px;margin-top:4px}.stat .pill{display:inline-block;font-size:11px;padding:4px 8px;border-radius:20px;background:#edf8f2;color:var(--green);margin-top:7px}.section{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 8px 28px #3b241d0b}.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.section h2{font-family:Georgia,serif;margin:0}.list{display:grid;gap:13px;margin-top:16px}.row{border:1px solid var(--line);border-radius:16px;padding:16px;background:linear-gradient(180deg,#fff,#fffaf6);display:flex;justify-content:space-between;gap:16px}.order-title{font-weight:900;font-size:16px}.price{font-size:20px;color:var(--wine);font-weight:900}.meta{margin-top:7px;display:grid;gap:4px;color:#51473f;font-size:13px}.status{display:inline-flex;width:max-content;padding:5px 9px;border-radius:999px;background:#f2e6d7;color:var(--wine);font-size:11px;font-weight:900;text-transform:uppercase}.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}.actions a{text-decoration:none}.duty{display:flex;align-items:center;gap:10px;background:#ffffff12;border:1px solid #ffffff24;border-radius:999px;padding:7px 10px}.switch{position:relative;width:45px;height:24px}.switch input{display:none}.slider{position:absolute;inset:0;background:#ffffff35;border-radius:99px;cursor:pointer}.slider:before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}.switch input:checked+.slider{background:#28a56a}.switch input:checked+.slider:before{transform:translateX(21px)}.error{color:#b42318;margin-top:10px;font-size:13px}.empty{text-align:center;padding:35px;color:var(--muted)}@media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}.top{align-items:flex-start}.row{flex-direction:column}.actions{justify-content:flex-start}.wrap{padding:12px}.section{padding:15px}}@media(max-width:420px){.grid{gap:9px}.stat{padding:13px}.stat b{font-size:25px}.top{padding:16px}.duty span{display:none}}
</style></head><body>
<div id="login" class="login"><div class="login-card"><div class="brand"><div class="logo">BA</div><div><h1>Bon Amigos</h1><div class="muted">Rider delivery portal</div></div></div><form id="loginForm" class="form"><input id="email" type="email" placeholder="Rider email" autocomplete="username" required><input id="password" type="password" placeholder="Password" autocomplete="current-password" required><button class="btn primary">Login to Dashboard</button></form><p id="err" class="error"></p></div></div>
<div id="app" class="wrap" style="display:none"><header class="top"><div><div style="font-weight:900;font-size:19px">🚴 Rider Dashboard</div><small id="who"></small></div><div style="display:flex;align-items:center;gap:9px"><div class="duty"><span>Duty</span><label class="switch"><input id="duty" type="checkbox"><i class="slider"></i></label><b id="dutyText">OFF</b></div><button id="logout" class="btn light">Logout</button></div></header>
<div class="grid"><div class="stat"><span>Active Orders</span><b id="assigned">0</b></div><div class="stat"><span>Out for Delivery</span><b id="out">0</b></div><div class="stat"><span>Delivered Today</span><b id="delivered">0</b></div><div class="stat"><span>GPS</span><b id="gps">OFF</b><span class="pill" id="gpsPill">Location inactive</span></div></div>
<section class="section"><div class="section-head"><div><h2>My Orders</h2><div class="muted">Only orders assigned to your rider account are shown.</div></div><span class="status" id="sync">Live</span></div><div id="orders" class="list"></div></section></div>
<script>const firebaseConfig={apiKey:"AIzaSyCmrAbpKaR0cSkigBs8rbW9g8l2db47n9A",databaseURL:"https://restro-56bc7-default-rtdb.firebaseio.com",authDomain:"restro-56bc7.firebaseapp.com",projectId:"restro-56bc7",storageBucket:"restro-56bc7.firebasestorage.app",messagingSenderId:"636167397540",appId:"1:636167397540:web:cfc9d31275fc8832b9c631",measurementId:"G-X3QF67PKXS"};firebase.initializeApp(firebaseConfig);const db=firebase.database(),auth=firebase.auth(),$=id=>document.getElementById(id);let uid=null,staff=null,ordersRef=null,watchId=null;const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));function todayStart(){const d=new Date();d.setHours(0,0,0,0);return d.getTime()}function render(v){const arr=Object.entries(v||{}).map(([id,x])=>({id,...x})).filter(x=>x&&x.riderId===uid).sort((a,b)=>Number(b.createdAt||0)-Number(a.createdAt||0));const active=arr.filter(x=>!['delivered','cancelled'].includes(x.status));$('assigned').textContent=active.length;$('out').textContent=arr.filter(x=>x.status==='out_for_delivery').length;$('delivered').textContent=arr.filter(x=>x.status==='delivered'&&Number(x.updatedAt||x.createdAt||0)>=todayStart()).length;$('orders').innerHTML=arr.map(o=>{const next=o.status==='assigned'?'accepted':o.status==='accepted'?'picked_up':o.status==='picked_up'?'out_for_delivery':o.status==='out_for_delivery'?'delivered':'';const nav=Number.isFinite(Number(o.latitude))&&Number.isFinite(Number(o.longitude))?`<a class="btn light" target="_blank" href="https://www.google.com/maps/dir/?api=1&destination=${o.latitude},${o.longitude}">🧭 Navigate</a>`:'';const call=o.phone?`<a class="btn light" href="tel:${esc(o.phone)}">📞 Call</a>`:'';return `<article class="row"><div><div class="order-title">#${esc(o.orderNo||o.id.slice(0,7))} <span class="price">₹${esc(o.total||0)}</span></div><div class="meta"><div>👤 ${esc(o.name||'Customer')} · ${esc(o.phone||'')}</div><div>📍 ${esc(o.address||'')}</div>${o.gpsAddress?`<div>🗺️ ${esc(o.gpsAddress)}</div>`:''}<div>💳 ${esc((o.paymentMethod||'').toUpperCase())} · Payment: ${esc(o.paymentStatus||'pending')}</div><div>🛍️ ${Array.isArray(o.items)?o.items.map(i=>esc(i.name)+' × '+esc(i.qty||1)).join(', '):'Order items'}</div><span class="status">${esc((o.status||'pending').replaceAll('_',' '))}</span></div></div><div class="actions">${call}${nav}${next?`<button class="btn primary" onclick="statusOrder('${esc(o.id)}','${next}')">${next.replaceAll('_',' ').toUpperCase()}</button>`:''}</div></article>`}).join('')||'<div class="empty">No orders assigned right now.</div>'}function listen(){if(ordersRef)ordersRef.off();ordersRef=db.ref('orders').orderByChild('riderId').equalTo(uid);ordersRef.on('value',s=>{render(s.val());$('sync').textContent='Live'} ,e=>{$('sync').textContent='Error';$('orders').innerHTML='<div class="empty">Could not load orders. Check Firebase Rules.</div>';console.error(e)})}async function setDuty(on){if(!uid)return;try{await db.ref('staff/'+uid+'/active').set(!!on);$('dutyText').textContent=on?'ON':'OFF';if(on)startGPS();else stopGPS()}catch(e){$('duty').checked=!on;alert('Could not change duty: '+e.message)}}function startGPS(){if(!navigator.geolocation)return;$('gps').textContent='…';watchId=navigator.geolocation.watchPosition(p=>{db.ref('riderLocations/'+uid).set({latitude:p.coords.latitude,longitude:p.coords.longitude,updatedAt:Date.now(),online:true});$('gps').textContent='ON';$('gpsPill').textContent='Live location'},()=>{$('gps').textContent='OFF';$('gpsPill').textContent='Allow location'}, {enableHighAccuracy:true,maximumAge:10000,timeout:10000})}function stopGPS(){if(watchId!==null){navigator.geolocation.clearWatch(watchId);watchId=null}db.ref('riderLocations/'+uid+'/online').set(false).catch(()=>{});$('gps').textContent='OFF';$('gpsPill').textContent='Location inactive'}window.statusOrder=async(id,status)=>{try{await db.ref('orders/'+id).update({status,updatedAt:Date.now()})}catch(e){alert('Update failed: '+e.message)}};$('duty').onchange=e=>setDuty(e.target.checked);$('loginForm').onsubmit=async e=>{e.preventDefault();$('err').textContent='';try{await auth.signInWithEmailAndPassword($('email').value.trim(),$('password').value)}catch(x){$('err').textContent=x.message}};$('logout').onclick=()=>auth.signOut();auth.onAuthStateChanged(async u=>{if(!u){uid=null;if(ordersRef)ordersRef.off();stopGPS();$('login').style.display='grid';$('app').style.display='none';return}try{const s=await db.ref('staff/'+u.uid).once('value');const v=s.val();if(!s.exists()||v.role!=='rider'){throw Error('Rider account is not configured for this user.')}uid=u.uid;staff=v;$('who').textContent=v.name||u.email;$('login').style.display='none';$('app').style.display='block';$('duty').checked=v.active!==false;$('dutyText').textContent=v.active===false?'OFF':'ON';listen();if(v.active!==false)startGPS()}catch(e){$('err').textContent=e.message;await auth.signOut()}});</script></body></html>
