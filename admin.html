<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Bon Amigos</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#7A1F2B">
<link rel="manifest" href="admin-manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">

<!-- ============================================================
  BON AMIGOS — ADMIN (Phase 3)
  Full-control dashboard for the owner/manager:
   - Reservations tab: view, confirm, cancel bookings from the site
   - Tables tab: add/remove tables, see live free/occupied/reserved
     status, and change any table's status
  Captains get a separate, lighter app: captain.html — same login
  system, but scoped by role. Admin access is granted via an
  `admins/{uid}` entry in the Realtime Database (not the `staff`
  node — that one's for captains and riders).

  SETUP (one-time, in Firebase Console) — see RESERVATIONS-SETUP.md
  for full step-by-step instructions, including the security rules
  and how to create staff accounts with a role.
  ============================================================ -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<style>
  :root{
    --ink:#241A16; --ivory:#FBF7F1; --paper:#F3ECE2;
    --wine:#7A1F2B; --wine-deep:#5A1620; --gold:#B98A3B;
    --olive:#5F6B47; --line:rgba(36,26,22,0.12);
    --free:#4B5636; --free-bg:#DCE6D3;
    --occupied:#7A1F2B; --occupied-bg:#EBD3D3;
    --reserved:#8A6417; --reserved-bg:#F3E3C8;
    --font-display:"Fraunces",Georgia,serif; --font-body:"Manrope",-apple-system,sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:var(--font-body);color:var(--ink);background:var(--paper);}
  h1,h2{font-family:var(--font-display);font-weight:600;margin:0;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;}
  input{font-family:inherit;}

  /* ---- login ---- */
  .login-screen{
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .login-card{
    background:var(--ivory);border:1px solid var(--line);border-radius:8px;
    padding:36px 30px;width:100%;max-width:360px;
  }
  .login-card h1{font-size:1.5rem;margin-bottom:6px;}
  .login-card p{color:#6c5d54;font-size:0.9rem;margin:0 0 24px;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:0.82rem;font-weight:700;margin-bottom:6px;}
  .field input{
    width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:6px;
    font-size:0.95rem;background:#fff;
  }
  .field input:focus{outline:none;border-color:var(--wine);}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:12px 20px;font-size:0.92rem;font-weight:600;border-radius:6px;width:100%;
    background:var(--wine);color:#fff;
  }
  .btn:hover{background:var(--wine-deep);}
  .btn:disabled{opacity:0.6;cursor:default;}
  .btn-sm{width:auto;padding:7px 14px;font-size:0.8rem;border-radius:5px;}
  .btn-outline-sm{
    width:auto;padding:6px 12px;font-size:0.78rem;border-radius:5px;
    border:1.5px solid var(--line);color:var(--ink);
  }
  .btn-outline-sm:hover{border-color:var(--wine);color:var(--wine);}
  .btn-outline-sm.danger:hover{border-color:var(--occupied);color:var(--occupied);}
  .login-error{color:var(--wine-deep);font-size:0.85rem;margin-top:14px;display:none;}
  .login-error.show{display:block;}

  /* ---- dashboard ---- */
  .dash{display:none;min-height:100vh;}
  .dash.open{display:block;}
  .topbar{
    background:var(--ink);color:var(--ivory);padding:16px 24px;
    display:flex;align-items:center;justify-content:space-between;
  }
  .topbar .logo{font-family:var(--font-display);font-size:1.15rem;}
  .topbar .logo span{color:var(--gold);font-family:var(--font-body);font-size:0.75rem;display:block;margin-top:2px;}
  #logoutBtn{color:#D8CEC2;font-size:0.85rem;}
  #logoutBtn:hover{color:#fff;}

  /* ---- tabs ---- */
  .tabbar{
    max-width:1100px;margin:0 auto;padding:16px 20px 0;
    display:flex;gap:8px;
  }
  .tab-btn{
    padding:10px 18px;font-size:0.88rem;font-weight:700;border-radius:8px 8px 0 0;
    color:#6c5d54;border-bottom:3px solid transparent;
  }
  .tab-btn.active{color:var(--wine);border-bottom-color:var(--wine);}
  .tab-panel{display:none;}
  .tab-panel.active{display:block;}

  .toolbar{
    max-width:1100px;margin:0 auto;padding:20px 20px 0;
    display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;
  }
  .filters{display:flex;flex-wrap:wrap;gap:8px;}
  .filters button{
    padding:7px 14px;font-size:0.8rem;font-weight:600;border-radius:20px;
    border:1.5px solid var(--line);color:#6c5d54;background:var(--ivory);
  }
  .filters button.active{background:var(--wine);border-color:var(--wine);color:#fff;}
  .search-box input{
    padding:8px 14px;border:1.5px solid var(--line);border-radius:20px;font-size:0.85rem;
    width:220px;background:var(--ivory);
  }
  .search-box input:focus{outline:none;border-color:var(--wine);}

  .content{max-width:1100px;margin:0 auto;padding:20px;}
  .empty-state{
    text-align:center;padding:60px 20px;color:#8C8074;
  }
  .empty-state h2{font-size:1.1rem;margin-bottom:6px;color:var(--ink);}

  .res-grid{display:grid;gap:12px;}
  .res-card{
    background:var(--ivory);border:1px solid var(--line);border-radius:8px;
    padding:16px 18px;display:grid;gap:10px;
    grid-template-columns:1fr;
  }
  @media(min-width:800px){
    .res-card{grid-template-columns:1.4fr 1fr 1fr 0.8fr auto;align-items:center;gap:16px;}
  }
  .res-name{font-weight:700;font-size:1rem;}
  .res-sub{font-size:0.82rem;color:#6c5d54;margin-top:2px;}
  .res-meta{font-size:0.88rem;}
  .res-meta .lbl{color:#8C8074;font-size:0.75rem;display:block;}
  .res-notes{font-size:0.82rem;color:#6c5d54;font-style:italic;}
  .status-pill{
    display:inline-block;padding:4px 11px;border-radius:20px;font-size:0.75rem;font-weight:700;
    text-transform:capitalize;
  }
  .status-pill.pending{background:#F3E3C8;color:#8A6417;}
  .status-pill.confirmed{background:#DCE6D3;color:#4B5636;}
  .status-pill.cancelled{background:#EBD3D3;color:#7A1F2B;}
  .status-pill.free{background:var(--free-bg);color:var(--free);}
  .status-pill.occupied{background:var(--occupied-bg);color:var(--occupied);}
  .status-pill.reserved{background:var(--reserved-bg);color:var(--reserved);}
  .res-actions{display:flex;gap:8px;flex-wrap:wrap;}

  .loading{text-align:center;padding:60px 20px;color:#8C8074;}

  /* ---- stats ---- */
  .stats-row{
    max-width:1100px;margin:0 auto;padding:20px 20px 0;
    display:grid;grid-template-columns:repeat(2,1fr);gap:12px;
  }
  @media(min-width:700px){ .stats-row{grid-template-columns:repeat(4,1fr);} }
  .stat-card{
    background:var(--ivory);border:1px solid var(--line);border-radius:8px;
    padding:14px 16px;text-align:center;
  }
  .stat-card .num{font-family:var(--font-display);font-size:1.6rem;color:var(--wine);}
  .stat-card .lbl{font-size:0.75rem;color:#8C8074;text-transform:uppercase;letter-spacing:0.03em;}

  /* ---- add table form ---- */
  .add-table-form{
    background:var(--ivory);border:1px solid var(--line);border-radius:8px;
    padding:16px 18px;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:20px;
  }
  .add-table-form .field{margin:0;flex:1;min-width:110px;}
  .add-table-form .btn{width:auto;padding:11px 20px;}

  /* ---- table grid ---- */
  .table-grid{display:grid;gap:14px;grid-template-columns:repeat(2,1fr);}
  @media(min-width:600px){ .table-grid{grid-template-columns:repeat(3,1fr);} }
  @media(min-width:900px){ .table-grid{grid-template-columns:repeat(4,1fr);} }
  .table-card{
    background:var(--ivory);border:1.5px solid var(--line);border-radius:8px;
    padding:14px;display:flex;flex-direction:column;gap:8px;
    border-left:4px solid var(--line);
  }
  .table-card.status-free{border-left-color:var(--free);}
  .table-card.status-occupied{border-left-color:var(--occupied);}
  .table-card.status-reserved{border-left-color:var(--reserved);}
  .table-card-top{display:flex;justify-content:space-between;align-items:center;}
  .table-num{font-family:var(--font-display);font-weight:600;font-size:1.05rem;}
  .table-cap{font-size:0.8rem;color:#6c5d54;}
  .table-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;}
</style>
</head>
<body>

<script>

/* Same values as FIREBASE_CONFIG in index.html and captain.html */

firebase.initializeApp(FIREBASE_CONFIG);
const auth = firebase.auth();
const db = firebase.database();
</script>

<!-- ================= LOGIN ================= -->
<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <h1>Admin Login</h1>
    <p id="loginSub">Sign in to manage reservations and tables.</p>
    <form id="loginForm">
      <div class="field">
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" required autocomplete="username">
      </div>
      <div class="field">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn" id="loginBtn">Sign In</button>
      <p class="login-error" id="loginError"></p>
    </form>
  </div>
</div>

<!-- ================= DASHBOARD ================= -->
<div class="dash" id="dash">
  <div class="topbar">
    <div class="logo">Bon Amigos<span>Admin</span></div>
    <button id="logoutBtn">Sign Out</button>
  </div>

  <div class="tabbar">
    <button class="tab-btn active" data-tab="reservations">Reservations</button>
    <button class="tab-btn" data-tab="tables">Tables</button>
  </div>

  <!-- ---- RESERVATIONS TAB ---- -->
  <div class="tab-panel active" id="panel-reservations">
    <div class="toolbar">
      <div class="filters" id="filters">
        <button data-filter="all" class="active">All</button>
        <button data-filter="pending">Pending</button>
        <button data-filter="confirmed">Confirmed</button>
        <button data-filter="cancelled">Cancelled</button>
      </div>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search name or phone…">
      </div>
    </div>
    <div class="content">
      <div class="loading" id="loadingResState">Loading reservations…</div>
      <div class="res-grid" id="resGrid" style="display:none;"></div>
      <div class="empty-state" id="emptyResState" style="display:none;">
        <h2>No reservations here</h2>
        <p>Try a different filter or check back once bookings come in.</p>
      </div>
    </div>
  </div>

  <!-- ---- TABLES TAB ---- -->
  <div class="tab-panel" id="panel-tables">
    <div class="stats-row" id="tableStats"></div>
    <div class="content">
      <form class="add-table-form" id="addTableForm">
        <div class="field">
          <label for="newTableNum">Table number</label>
          <input type="number" id="newTableNum" min="1" required placeholder="e.g. 5">
        </div>
        <div class="field">
          <label for="newTableCap">Seats</label>
          <input type="number" id="newTableCap" min="1" required placeholder="e.g. 4">
        </div>
        <button type="submit" class="btn">Add Table</button>
      </form>
      <div class="loading" id="loadingTablesState">Loading tables…</div>
      <div class="table-grid" id="tableGrid" style="display:none;"></div>
      <div class="empty-state" id="emptyTablesState" style="display:none;"></div>
    </div>
  </div>
</div>

<script src="tables.js"></script>
<script src="reservations.js"></script>
<script>
let currentFilter = "all";
let currentSearch = "";

/* ---- Auth + role check ---- */
document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = document.getElementById("loginEmail").value.trim();
  const pass  = document.getElementById("loginPassword").value;
  const btn   = document.getElementById("loginBtn");
  const err   = document.getElementById("loginError");
  err.classList.remove("show");
  btn.disabled = true; btn.textContent = "Signing in…";
  try{
    await auth.signInWithEmailAndPassword(email, pass);
  }catch(e){
    err.textContent = "Incorrect email or password.";
    err.classList.add("show");
    btn.disabled = false; btn.textContent = "Sign In";
  }
});

document.getElementById("logoutBtn").addEventListener("click", () => auth.signOut());

auth.onAuthStateChanged(async (user) => {
  const err = document.getElementById("loginError");
  if(user){
    try{
      const adminSnap = await db.ref("admins/" + user.uid).get();
      const adminVal = adminSnap.val();
      const isAdmin = adminVal === true || (adminVal && adminVal.isAdmin === true);
      if(!isAdmin){
        err.textContent = "This login isn't set up for admin access. Ask the owner to add your account under 'admins' in the database.";
        err.classList.add("show");
        await auth.signOut();
        return;
      }
    }catch(e){
      console.error("Role check failed:", e);
      err.textContent = "Couldn't verify your access. Check your connection and try again.";
      err.classList.add("show");
      await auth.signOut();
      return;
    }
    document.getElementById("loginScreen").style.display = "none";
    document.getElementById("dash").classList.add("open");
    subscribeToReservations(onReservationsChange);
    subscribeToTables(onTablesChange);
  }else{
    document.getElementById("loginScreen").style.display = "flex";
    document.getElementById("dash").classList.remove("open");
    document.getElementById("loginBtn").disabled = false;
    document.getElementById("loginBtn").textContent = "Sign In";
    if(unsubscribeReservations) unsubscribeReservations();
    if(unsubscribeTables) unsubscribeTables();
  }
});

/* ---- Tabs ---- */
document.querySelectorAll(".tab-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById("panel-" + btn.dataset.tab).classList.add("active");
  });
});

/* ---- Reservations ---- */
function onReservationsChange(list, err){
  document.getElementById("loadingResState").style.display = "none";
  if(err){
    document.getElementById("loadingResState").style.display = "";
    document.getElementById("loadingResState").textContent = "Couldn't load reservations. Check Firestore rules and your connection.";
    return;
  }
  renderReservationGrid(
    document.getElementById("resGrid"),
    document.getElementById("emptyResState"),
    filterReservations(list, currentFilter, currentSearch)
  );
}

document.getElementById("filters").addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-filter]");
  if(!btn) return;
  document.querySelectorAll("#filters button").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  currentFilter = btn.dataset.filter;
  onReservationsChange(allReservations);
});

document.getElementById("searchInput").addEventListener("input", (e) => {
  currentSearch = e.target.value.trim().toLowerCase();
  onReservationsChange(allReservations);
});

/* ---- Tables ---- */
function onTablesChange(list, err){
  document.getElementById("loadingTablesState").style.display = "none";
  if(err){
    document.getElementById("loadingTablesState").style.display = "";
    document.getElementById("loadingTablesState").textContent = "Couldn't load tables. Check Firestore rules and your connection.";
    return;
  }
  const grid = document.getElementById("tableGrid");
  const empty = document.getElementById("emptyTablesState");
  if(!list.length){ grid.style.display = "none"; empty.style.display = ""; }
  else { empty.style.display = "none"; grid.style.display = "grid"; }
  renderTableGrid(grid, list, true);

  const c = tableCounts(list);
  document.getElementById("tableStats").innerHTML = `
    <div class="stat-card"><div class="num">${c.free}</div><div class="lbl">Free</div></div>
    <div class="stat-card"><div class="num">${c.occupied}</div><div class="lbl">Occupied</div></div>
    <div class="stat-card"><div class="num">${c.reserved}</div><div class="lbl">Reserved</div></div>
    <div class="stat-card"><div class="num">${c.total}</div><div class="lbl">Total Tables</div></div>
  `;
}

document.getElementById("addTableForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const numEl = document.getElementById("newTableNum");
  const capEl = document.getElementById("newTableCap");
  await addTable(numEl.value, capEl.value);
  numEl.value = ""; capEl.value = "";
});

/* ---- PWA ---- */
if("serviceWorker" in navigator){
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
