<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#7A1F2B"><title>Bon Amigos Captain</title><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui;background:#f6f3ef;color:#241a16}button,input{font:inherit}.app{max-width:1400px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;background:#fff;padding:14px 18px;border-radius:18px;position:sticky;top:10px;z-index:5}.brand{font-weight:800}.btn{border:0;border-radius:11px;padding:10px 14px;cursor:pointer;font-weight:700}.primary{background:#7a1f2b;color:#fff}.dark{background:#241a16;color:#fff}.light{background:#eee7df}.danger{background:#b42318;color:#fff}.grid{display:grid;gap:14px}.stats{grid-template-columns:repeat(4,1fr);margin:18px 0}.card{background:#fff;border:1px solid #eadfd4;border-radius:18px;padding:16px}.stat b{font-size:28px;display:block}.section{margin-top:16px}.table-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}.table-card{padding:16px;border-radius:16px;border:2px solid #ddd;background:#fff}.free{border-color:#4f8a5b}.reserved{border-color:#b98a3b}.occupied{border-color:#b42318}.blocked{border-color:#555}.cleaning{border-color:#5d6d9a}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.wide{grid-column:1/-1}input{width:100%;padding:11px;border:1px solid #ddd2c7;border-radius:10px}.list{display:grid;gap:9px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px;border:1px solid #eee3d8;border-radius:12px}.muted{color:#6c5d54;font-size:13px}.actions{display:flex;flex-wrap:wrap;gap:7px}.hidden{display:none!important}.pill{padding:4px 8px;border-radius:999px;background:#eee7df;font-size:12px;font-weight:700}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login .card{width:min(430px,100%)}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr}.app{padding:10px}.row{flex-direction:column;align-items:flex-start}.table-grid{grid-template-columns:1fr 1fr}}@media(max-width:430px){.table-grid{grid-template-columns:1fr}}</style></head><body><div id="login" class="login"><div class="card"><h1>Captain Login</h1><p class="muted">Realtime table & booking dashboard</p><form id="loginForm" class="form"><input class="wide" id="email" type="email" placeholder="Captain email" required><input class="wide" id="password" type="password" placeholder="Password" required><button class="btn primary wide">Login</button></form><p id="err" class="muted"></p></div></div><div id="app" class="app hidden"><div class="top"><div><div class="brand">Captain Dashboard</div><div class="muted" id="who"></div></div><div class="actions"><button class="btn light" id="refresh">Refresh</button><button class="btn dark" id="logout">Logout</button></div></div><div class="grid stats"><div class="card stat"><span>Today's bookings</span><b id="b">0</b></div><div class="card stat"><span>Free tables</span><b id="f">0</b></div><div class="card stat"><span>Occupied</span><b id="o">0</b></div><div class="card stat"><span>Pending</span><b id="p">0</b></div></div><section class="card section"><h2>Quick Walk-in / Captain Booking</h2><form id="quickForm" class="form"><input id="qn" placeholder="Customer name" required><input id="qp" placeholder="Phone" required><input id="qg" type="number" min="1" value="2" placeholder="Guests" required><input id="qd" type="date" required><input id="qt" type="time" required><button class="btn primary wide">Book & Seat</button></form></section><section class="card section"><h2>Live Table Floor</h2><p class="muted">Changes appear live for all staff dashboards.</p><div id="tables" class="table-grid"></div></section><section class="card section"><h2>Bookings</h2><div id="bookings" class="list"></div></section></div><script>const firebaseConfig={apiKey:"AIzaSyCmrAbpKaR0cSkigBs8rbW9g8l2db47n9A",databaseURL:"https://restro-56bc7-default-rtdb.firebaseio.com",authDomain:"restro-56bc7.firebaseapp.com",projectId:"restro-56bc7",storageBucket:"restro-56bc7.firebasestorage.app",messagingSenderId:"636167397540",appId:"1:636167397540:web:cfc9d31275fc8832b9c631",measurementId:"G-X3QF67PKXS"};firebase.initializeApp(firebaseConfig);const db=firebase.database(),auth=firebase.auth(),$=id=>document.getElementById(id);let tables={},bookings={};const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const A=x=>Object.entries(x||{}).map(([id,v])=>({id,...(v||{})}));function render(){let ts=A(tables).sort((a,b)=>Number(a.number)-Number(b.number)),bs=A(bookings).sort((a,b)=>Number(b.createdAt||0)-Number(a.createdAt||0)),today=new Date().toISOString().slice(0,10);$('b').textContent=bs.filter(x=>x.date===today&&x.status!=='cancelled').length;$('f').textContent=ts.filter(x=>(x.status||'free')==='free').length;$('o').textContent=ts.filter(x=>x.status==='occupied').length;$('p').textContent=bs.filter(x=>x.status==='pending').length;$('tables').innerHTML=ts.map(t=>`<div class="table-card ${esc(t.status||'free')}"><b>Table ${esc(t.number)}</b><div class="muted">${esc(t.seats)} seats · ${esc(t.section||'Main')}</div><p><span class="pill">${esc(t.status||'free')}</span></p><div class="actions"><button class="btn light" onclick="freeTable('${t.id}')">Free</button><button class="btn dark" onclick="occ('${t.id}')">Occupied</button><button class="btn light" onclick="clean('${t.id}')">Cleaning</button><button class="btn danger" onclick="block('${t.id}')">Block</button></div></div>`).join('')||'<p class="muted">No tables.</p>';$('bookings').innerHTML=bs.map(x=>`<div class="row"><div><b>${esc(x.name)}</b><div class="muted">${esc(x.phone)} · ${esc(x.guests)} guests · ${esc(x.date)} ${esc(x.time)}</div><div class="muted">Status: ${esc(x.status||'pending')}</div></div><div class="actions"><button class="btn primary" onclick="statusBooking('${x.id}','confirmed')">Confirm</button><button class="btn dark" onclick="seat('${x.id}')">Seated</button><button class="btn light" onclick="pick('${x.id}')">Book Table</button><button class="btn danger" onclick="statusBooking('${x.id}','cancelled')">Cancel</button></div></div>`).join('')||'<p class="muted">No bookings.</p>'}
function listen(){db.ref('tables').on('value',s=>{tables=s.val()||{};render()});db.ref('reservations').on('value',s=>{bookings=s.val()||{};render()})}function free(){listen()}
$('loginForm').onsubmit=async e=>{e.preventDefault();$('err').textContent='';try{await auth.signInWithEmailAndPassword($('email').value,$('password').value)}catch(x){$('err').textContent=x.message}};$('logout').onclick=()=>auth.signOut();$('refresh').onclick=render;
auth.onAuthStateChanged(async u=>{if(!u){$('login').classList.remove('hidden');$('app').classList.add('hidden');return}const s=await db.ref('staff/'+u.uid).once('value'),v=s.val();if(!s.exists()||v.role!=='captain'||v.active===false){$('err').textContent='Captain access required';auth.signOut();return}$('login').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent=v.name||u.email;listen()});
window.statusBooking=async(id,v)=>{await db.ref('reservations/'+id).update({status:v,updatedAt:Date.now(),updatedBy:auth.currentUser.uid})};window.freeTable=async id=>db.ref('tables/'+id).update({status:'free',currentBookingId:null,updatedAt:Date.now()});window.occ=async id=>db.ref('tables/'+id).update({status:'occupied',updatedAt:Date.now()});window.clean=async id=>db.ref('tables/'+id).update({status:'cleaning',updatedAt:Date.now()});window.block=async id=>db.ref('tables/'+id).update({status:'blocked',updatedAt:Date.now()});
async function chooseTable(){let ts=A(tables).filter(t=>(t.status||'free')==='free');if(!ts.length){alert('No free table');return null}let n=prompt('Free table numbers: '+ts.map(t=>t.number).join(', '));return ts.find(x=>String(x.number)===String(n))||null}window.seat=async id=>{let t=await chooseTable();if(!t)return;await db.ref('reservations/'+id).update({tableId:t.id,status:'seated',updatedAt:Date.now()});await db.ref('tables/'+t.id).update({status:'occupied',currentBookingId:id,updatedAt:Date.now()})};window.pick=async id=>{let t=await chooseTable();if(!t)return;await db.ref('reservations/'+id).update({tableId:t.id,status:'confirmed',updatedAt:Date.now()});await db.ref('tables/'+t.id).update({status:'reserved',currentBookingId:id,updatedAt:Date.now()})};
$('quickForm').onsubmit=async e=>{e.preventDefault();let t=await chooseTable();if(!t)return;let id='r_'+Date.now();await db.ref('reservations/'+id).set({name:$('qn').value.trim(),phone:$('qp').value.trim(),guests:Number($('qg').value),date:$('qd').value,time:$('qt').value,status:'seated',tableId:t.id,source:'captain',createdAt:Date.now(),createdBy:auth.currentUser.uid});await db.ref('tables/'+t.id).update({status:'occupied',currentBookingId:id,updatedAt:Date.now()});e.target.reset();$('qd').value=new Date().toISOString().slice(0,10)};$('qd').value=new Date().toISOString().slice(0,10);</script></body></html>
