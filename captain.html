<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#7A1F2B"><title>Bon Amigos Captain</title><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#f6f3ef;color:#241a16}button,input,select,textarea{font:inherit}.app{max-width:1400px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#fff;padding:14px 18px;border-radius:18px;box-shadow:0 6px 24px #0000000d;position:sticky;top:10px;z-index:5}.brand{font-weight:800}.btn{border:0;border-radius:11px;padding:10px 14px;cursor:pointer;font-weight:700}.primary{background:#7a1f2b;color:#fff}.dark{background:#241a16;color:#fff}.light{background:#eee7df}.danger{background:#b42318;color:#fff}.grid{display:grid;gap:14px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin:18px 0}.card{background:#fff;border:1px solid #eadfd4;border-radius:18px;padding:16px}.stat b{font-size:28px;display:block}.tabs{display:flex;gap:8px;overflow:auto;padding:8px 0}.tab{white-space:nowrap}.section{margin-top:16px}.table-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}.table-card{padding:16px;border-radius:16px;border:2px solid #ddd;background:#fff}.free{border-color:#4f8a5b}.reserved{border-color:#b98a3b}.occupied{border-color:#b42318}.blocked{border-color:#555}.cleaning{border-color:#5d6d9a}.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.form>*{min-width:0}input,select,textarea{width:100%;padding:11px;border:1px solid #ddd2c7;border-radius:10px;background:#fff}.wide{grid-column:1/-1}.list{display:grid;gap:9px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px;border:1px solid #eee3d8;border-radius:12px;background:#fff}.muted{color:#6c5d54;font-size:13px}.actions{display:flex;flex-wrap:wrap;gap:7px}.hidden{display:none!important}.pill{padding:4px 8px;border-radius:999px;background:#eee7df;font-size:12px;font-weight:700}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login .card{width:min(430px,100%)}@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}.form{grid-template-columns:1fr}.app{padding:10px}.top{top:0}.table-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:480px){.table-grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.btn{padding:9px 11px}}
</style></head><body><div id="login" class="login"><div class="card"><h1>Captain Login</h1><p class="muted">Table & booking floor dashboard</p><form id="loginForm" class="form"><input class="wide" id="email" type="email" placeholder="Captain email" required><input class="wide" id="password" type="password" placeholder="Password" required><button class="btn primary wide">Login</button></form><p id="err" class="muted"></p></div></div><div id="app" class="app hidden"><div class="top"><div><div class="brand">Captain Dashboard</div><div class="muted" id="who"></div></div><div class="actions"><button class="btn light" id="refresh">Refresh</button><button class="btn dark" id="logout">Logout</button></div></div><div class="grid stats"><div class="card stat"><span>Today's bookings</span><b id="b">0</b></div><div class="card stat"><span>Free tables</span><b id="f">0</b></div><div class="card stat"><span>Occupied</span><b id="o">0</b></div><div class="card stat"><span>Pending</span><b id="p">0</b></div></div><section class="card section"><h2>Quick Walk-in / Captain Booking</h2><form id="quickForm" class="form"><input id="qn" placeholder="Customer name" required><input id="qp" placeholder="Phone" required><input id="qg" type="number" min="1" value="2" placeholder="Guests" required><input id="qd" type="date" required><input id="qt" type="time" required><button class="btn primary wide">Book & Seat</button></form></section><section class="card section"><h2>Live Table Floor</h2><p class="muted">Green = free · Gold = reserved · Red = occupied.</p><div id="tables" class="table-grid"></div></section><section class="card section"><h2>Bookings</h2><div id="bookings" class="list"></div></section></div><script>const firebaseConfig = {
  apiKey: "AIzaSyCmrAbpKaR0cSkigBs8rbW9g8l2db47n9A",
  authDomain: "restro-56bc7.firebaseapp.com",
  projectId: "restro-56bc7",
  storageBucket: "restro-56bc7.firebasestorage.app",
  messagingSenderId: "636167397540",
  appId: "1:636167397540:web:cfc9d31275fc8832b9c631",
  measurementId: "G-X3QF67PKXS"
};

const db=firebase.firestore(),auth=firebase.auth();const $=id=>document.getElementById(id);let tables=[],bookings=[];
auth.onAuthStateChanged(async u=>{if(!u){$('login').classList.remove('hidden');$('app').classList.add('hidden');return}let s=await db.collection('staff').doc(u.uid).get();if(!s.exists||s.data().role!=='captain'||s.data().active===false){alert('Captain access required');auth.signOut();return}$('login').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent=s.data().name||u.email;load()});
$('loginForm').onsubmit=async e=>{e.preventDefault();try{await auth.signInWithEmailAndPassword($('email').value,$('password').value)}catch(x){$('err').textContent=x.message}};$('logout').onclick=()=>auth.signOut();$('refresh').onclick=load;
async function load(){tables=(await db.collection('tables').orderBy('number').get()).docs.map(d=>({id:d.id,...d.data()}));bookings=(await db.collection('reservations').orderBy('createdAt','desc').limit(100).get()).docs.map(d=>({id:d.id,...d.data()}));render()}
function render(){let today=new Date().toISOString().slice(0,10);$('b').textContent=bookings.filter(x=>x.date===today&&x.status!=='cancelled').length;$('f').textContent=tables.filter(x=>(x.status||'free')==='free').length;$('o').textContent=tables.filter(x=>x.status==='occupied').length;$('p').textContent=bookings.filter(x=>x.status==='pending').length;$('tables').innerHTML=tables.map(t=>`<div class="table-card ${t.status||'free'}"><b>Table ${t.number}</b><div class="muted">${t.seats} seats · ${t.section||'Main'}</div><p><span class="pill">${t.status||'free'}</span></p><div class="actions"><button class="btn light" onclick="freeTable('${t.id}')">Free</button><button class="btn dark" onclick="occ('${t.id}')">Occupied</button><button class="btn light" onclick="clean('${t.id}')">Cleaning</button><button class="btn danger" onclick="block('${t.id}')">Block</button></div></div>`).join('');$('bookings').innerHTML=bookings.map(x=>`<div class="row"><div><b>${esc(x.name)}</b><div class="muted">${x.phone} · ${x.guests} guests · ${x.date} ${x.time}</div></div><div class="actions"><button class="btn primary" onclick="status('${x.id}','confirmed')">Confirm</button><button class="btn dark" onclick="seat('${x.id}')">Seated</button><button class="btn light" onclick="pick('${x.id}')">Book Table</button><button class="btn danger" onclick="status('${x.id}','cancelled')">Cancel</button></div></div>`).join('')||'<div class="muted">No bookings.</div>'}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
window.status=async(id,v)=>{await db.collection('reservations').doc(id).update({status:v,updatedAt:firebase.firestore.FieldValue.serverTimestamp(),updatedBy:auth.currentUser.uid});load()};window.seat=async id=>{let free=tables.filter(t=>(t.status||'free')==='free');if(!free.length)return alert('No free table');let n=prompt('Free table numbers: '+free.map(t=>t.number).join(', '));let t=free.find(x=>String(x.number)===String(n));if(!t)return;await db.runTransaction(async tx=>{tx.update(db.collection('reservations').doc(id),{tableId:t.id,status:'seated'});tx.update(db.collection('tables').doc(t.id),{status:'occupied',currentBookingId:id})});load()};window.pick=async id=>{let free=tables.filter(t=>(t.status||'free')==='free');let n=prompt('Free table numbers: '+free.map(t=>t.number).join(', '));let t=free.find(x=>String(x.number)===String(n));if(!t)return;await db.runTransaction(async tx=>{tx.update(db.collection('reservations').doc(id),{tableId:t.id,status:'confirmed'});tx.update(db.collection('tables').doc(t.id),{status:'reserved',currentBookingId:id})});load()};window.freeTable=async id=>{await db.collection('tables').doc(id).update({status:'free',currentBookingId:null});load()};window.occ=async id=>{await db.collection('tables').doc(id).update({status:'occupied'});load()};window.clean=async id=>{await db.collection('tables').doc(id).update({status:'cleaning'});load()};window.block=async id=>{await db.collection('tables').doc(id).update({status:'blocked'});load()};
$('quickForm').onsubmit=async e=>{e.preventDefault();let name=$('qn').value.trim(),phone=$('qp').value.trim(),guests=Number($('qg').value),date=$('qd').value,time=$('qt').value;let free=tables.filter(t=>(t.status||'free')==='free');if(!free.length)return alert('No free tables');let n=prompt('Free table numbers: '+free.map(t=>t.number).join(', '));let t=free.find(x=>String(x.number)===String(n));if(!t)return;let ref=db.collection('reservations').doc();await db.runTransaction(async tx=>{tx.set(ref,{name,phone,guests,date,time,status:'seated',tableId:t.id,source:'captain',createdAt:firebase.firestore.FieldValue.serverTimestamp(),createdBy:auth.currentUser.uid});tx.update(db.collection('tables').doc(t.id),{status:'occupied',currentBookingId:ref.id})});e.target.reset();load()};
$('qd').value=new Date().toISOString().slice(0,10);
</script></body></html>
